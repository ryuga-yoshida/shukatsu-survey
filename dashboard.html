<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>就活アンケート 集計 | 就活ナビ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --navy: #1B2A5E; --navy-deep: #101A3D; --navy-pale: #EAEEFB;
    --teal: #17A6A0; --teal-pale: #E4F7F6; --teal-ink: #0E6F6B;
    --ink: #172033; --ink-soft: #5B6478; --ink-faint: #8A93A8;
    --bg: #F4F6FB; --white: #fff; --line: #E1E5F0; --warn: #C98A1B; --warn-pale: #FFF4DC;
    --font-display: 'M PLUS 1p', sans-serif; --font-body: 'Noto Sans JP', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.7; }
  button, input, select, textarea { font-family: inherit; font-size: inherit; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 20px; }

  .topbar { background: var(--navy-deep); color: #fff; position: sticky; top: 0; z-index: 30; }
  .topbar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 58px; }
  .topbar .logo { font-family: var(--font-display); font-weight: 900; font-size: 16px; display: flex; align-items: center; gap: 12px; }
  .topbar .logo span { font-size: 11px; color: #9FB0F0; letter-spacing: .1em; font-weight: 700; }
  .topbar .right { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: #C5CDF0; }
  .btn { font-family: var(--font-display); font-weight: 700; font-size: 13px; padding: 8px 14px; border-radius: 8px; border: 1.5px solid transparent; cursor: pointer; background: var(--teal); color: #fff; transition: background .15s; }
  .btn:hover { background: #12908B; }
  .btn.ghost { background: transparent; color: #C5CDF0; border-color: rgba(255,255,255,.25); }
  .btn.ghost:hover { color: #fff; border-color: #fff; background: transparent; }
  .btn.light { background: var(--navy-pale); color: var(--navy); }
  .btn.light:hover { background: #DDE3F7; }
  .btn:disabled { opacity: .5; cursor: default; }

  .banner { background: var(--warn-pale); border-bottom: 1px solid #F1DFAF; color: #6B4A05; font-size: 13px; }
  .banner .wrap { padding-block: 8px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .banner[hidden] { display: none; }

  .settings { background: var(--white); border-bottom: 1px solid var(--line); }
  .settings[hidden] { display: none; }
  .settings .wrap { padding-block: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
  .settings label { font-family: var(--font-display); font-size: 12px; font-weight: 700; color: var(--ink-soft); display: block; margin-bottom: 4px; }
  .field { width: 100%; padding: 9px 12px; border: 1.5px solid var(--line); border-radius: 8px; background: #fff; }
  .field:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 3px var(--teal-pale); }
  .settings .actions { grid-column: 1 / -1; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .settings .hint { grid-column: 1 / -1; font-size: 12px; color: var(--ink-faint); }
  @media (max-width: 720px) { .settings .wrap { grid-template-columns: 1fr; } }

  .filters { background: var(--white); border-bottom: 1px solid var(--line); position: sticky; top: 58px; z-index: 20; }
  .filters .wrap { padding-block: 10px; display: flex; gap: 8px 18px; flex-wrap: wrap; align-items: center; }
  .filters .grp { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .filters .grp b { font-family: var(--font-display); font-size: 12px; color: var(--ink-soft); margin-right: 2px; }
  .chip { font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1.5px solid var(--line); background: #fff; cursor: pointer; color: var(--ink-soft); transition: all .15s; }
  .chip.is-on { background: var(--navy); border-color: var(--navy); color: #fff; }
  .filters .n { margin-left: auto; font-family: var(--font-display); font-weight: 700; font-size: 13px; color: var(--navy); }
  .filters .clear { font-size: 12px; color: var(--ink-faint); background: none; border: none; cursor: pointer; text-decoration: underline; }

  main { padding-block: 22px 60px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 22px; }
  .kpi { background: var(--white); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
  .kpi .l { font-family: var(--font-display); font-size: 11.5px; font-weight: 700; color: var(--ink-soft); letter-spacing: .04em; }
  .kpi .v { font-family: var(--font-display); font-size: 30px; font-weight: 900; color: var(--navy); line-height: 1.2; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .kpi .v small { font-size: 14px; color: var(--ink-faint); font-weight: 700; margin-left: 2px; }
  .kpi .s { font-size: 12px; color: var(--ink-faint); margin-top: 2px; }

  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .card { background: var(--white); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; min-width: 0; }
  .card.wide { grid-column: 1 / -1; }
  .card h3 { font-family: var(--font-display); font-size: 14.5px; font-weight: 700; color: var(--ink); line-height: 1.5; display: flex; gap: 8px; align-items: baseline; }
  .card h3 .qn { font-size: 11px; color: var(--teal-ink); letter-spacing: .08em; flex-shrink: 0; }
  .card .sub { font-size: 12px; color: var(--ink-faint); margin-top: 2px; }
  .card .n { font-size: 11.5px; color: var(--ink-faint); font-family: var(--font-display); font-weight: 700; margin-left: auto; white-space: nowrap; }
  .chart { position: relative; margin-top: 12px; }
  .section-title { font-family: var(--font-display); font-size: 12px; font-weight: 700; letter-spacing: .14em; color: var(--teal-ink); margin: 28px 0 10px; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } .filters { position: static; } }

  table.tbl { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
  table.tbl th, table.tbl td { padding: 8px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  table.tbl th { font-family: var(--font-display); font-size: 11.5px; color: var(--ink-soft); font-weight: 700; }
  table.tbl td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .score { display: inline-block; font-family: var(--font-display); font-weight: 900; padding: 1px 8px; border-radius: 6px; background: var(--navy-pale); color: var(--navy); }
  .dist { display: inline-flex; height: 10px; width: 120px; border-radius: 4px; overflow: hidden; vertical-align: middle; background: #EEF0F7; }
  .dist i { display: block; height: 100%; }
  .tbl-wrap { overflow-x: auto; }

  .texts { list-style: none; margin-top: 10px; display: flex; flex-direction: column; gap: 8px; max-height: 420px; overflow: auto; }
  .texts li { background: #F8F9FD; border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; font-size: 13px; }
  .texts li .m { display: block; font-size: 11px; color: var(--ink-faint); margin-top: 2px; }
  .texts .empty { color: var(--ink-faint); font-size: 13px; border: 1px dashed var(--line); background: none; text-align: center; }

  .cross-ctl { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
  .cross-ctl select { padding: 7px 10px; border: 1.5px solid var(--line); border-radius: 8px; background: #fff; max-width: 100%; }
  .legend-note { font-size: 11.5px; color: var(--ink-faint); margin-top: 6px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--ink-soft); }
  .empty-state h2 { font-family: var(--font-display); font-size: 20px; color: var(--navy); margin-bottom: 8px; }
  .empty-state[hidden] { display: none; }
  #content[hidden] { display: none; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--navy-deep); color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 50; }
  .toast.is-on { opacity: 1; }
</style>
</head>
<body>

<div class="topbar">
  <div class="wrap">
    <div class="logo">就活ナビ <span>SURVEY DASHBOARD</span></div>
    <div class="right">
      <span id="status">未接続</span>
      <button class="btn ghost" id="toggleSettings">設定</button>
      <button class="btn ghost" id="exportBtn" title="現在のフィルタで絞った回答をCSVで保存">CSV</button>
      <button class="btn" id="refreshBtn">更新</button>
    </div>
  </div>
</div>

<div class="banner" id="sampleBanner" hidden><div class="wrap">⚠︎ <b>サンプルデータ</b>を表示しています（架空の回答60件）。実データを見るには「設定」でApps ScriptのURLと合言葉を入力してください。</div></div>

<section class="settings" id="settings" hidden>
  <div class="wrap">
    <div><label for="epInput">Apps Script ウェブアプリURL（…/exec）</label><input class="field" id="epInput" type="url" placeholder="https://script.google.com/macros/s/.../exec"></div>
    <div><label for="keyInput">読み取り用の合言葉（Code.gs の READ_KEY）</label><input class="field" id="keyInput" type="password" placeholder="READ_KEY"></div>
    <div class="actions">
      <button class="btn" id="saveSettings">保存して読み込む</button>
      <button class="btn light" id="loadSample">サンプルデータで見る</button>
      <button class="btn light" id="loadFile">JSON/CSVファイルから読む</button>
      <input type="file" id="fileInput" accept=".json,.csv" hidden>
    </div>
    <div class="hint">URLと合言葉はこのブラウザにだけ保存されます。回答データの取得は GET /exec?key=… で行います。</div>
  </div>
</section>

<div class="filters" id="filters" hidden>
  <div class="wrap">
    <div class="grp" data-f="q0"><b>学年</b></div>
    <div class="grp" data-f="faculty"><b>学部</b></div>
    <div class="grp" data-f="q1"><b>進捗</b></div>
    <div class="grp" data-f="q3"><b>気持ち</b></div>
    <button class="clear" id="clearFilters">絞り込み解除</button>
    <div class="n"><span id="nShown">0</span> / <span id="nAll">0</span> 件</div>
  </div>
</div>

<main class="wrap">
  <div class="empty-state" id="empty">
    <h2>まだデータがありません</h2>
    <p>右上の「設定」からApps ScriptのURLと合言葉を入力すると、シートの回答を読み込みます。<br>先に見た目を確認したい場合は「サンプルデータで見る」を押してください。</p>
  </div>
  <div id="content" hidden>
    <div class="kpis" id="kpis"></div>
    <div id="sections"></div>
  </div>
</main>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="questions.js"></script>
<script>
(function () {
  var S = window.SURVEY_SCHEMA, CFG = window.SURVEY_CONFIG || {};
  var OTHER = "その他";
  var LS = { ep: "shukatsu-dash-ep", key: "shukatsu-dash-key" };
  var all = [], shown = [], charts = [], isSample = false;
  var filters = { q0: [], faculty: [], q1: [], q3: [] };
  var $ = function (id) { return document.getElementById(id); };
  var Q = {}; S.questions.forEach(function (q) { Q[q.id] = q; });

  var C = { navy: "#1B2A5E", teal: "#17A6A0", blue: "#3E5AC7", sky: "#8FA8FF", mint: "#5EE6DD", grey: "#C9CFE0", ink: "#172033", soft: "#5B6478" };
  var SEQ = ["#D9E3F5", "#8FA8FF", "#3E5AC7", "#1B2A5E"]; // matrix 4段階
  var CAT = [C.navy, C.teal, C.blue, C.sky, C.mint, "#F2A65A", "#D1495B", "#7B6CF6", C.grey];
  Chart.defaults.font.family = "'Noto Sans JP', sans-serif";
  Chart.defaults.font.size = 12;
  Chart.defaults.color = C.soft;

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function pct(n, d) { return d ? Math.round(n / d * 100) : 0; }
  var toastTimer; function toast(m) { $("toast").textContent = m; $("toast").classList.add("is-on"); clearTimeout(toastTimer); toastTimer = setTimeout(function () { $("toast").classList.remove("is-on"); }, 2800); }
  function get(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } }
  function set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  // ---------- data loading ----------
  function endpoint() { return get(LS.ep) || CFG.endpoint || ""; }
  function load() {
    var ep = endpoint(), key = get(LS.key);
    if (!ep || !key) { $("status").textContent = "未接続"; return Promise.resolve(false); }
    $("status").textContent = "読み込み中…"; $("refreshBtn").disabled = true;
    return fetch(ep + (ep.indexOf("?") >= 0 ? "&" : "?") + "key=" + encodeURIComponent(key) + "&t=" + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j.ok) throw new Error(j.error || "error");
        isSample = false; $("sampleBanner").hidden = true;
        setData(j.responses || []);
        $("status").textContent = "更新 " + new Date().toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" });
        return true;
      })
      .catch(function (e) { console.error(e); $("status").textContent = "取得エラー"; toast("読み込めませんでした：" + (e.message === "unauthorized" ? "合言葉が違います" : "URLと公開設定を確認してください")); return false; })
      .finally(function () { $("refreshBtn").disabled = false; });
  }
  function setData(rows) {
    all = rows.filter(function (r) { return r && r.answers; }).sort(function (a, b) { return (a.submittedAt || "") < (b.submittedAt || "") ? 1 : -1; });
    buildFilterChips(); applyFilters();
  }

  // ---------- filters ----------
  function buildFilterChips() {
    Object.keys(filters).forEach(function (qid) {
      var grp = document.querySelector('.grp[data-f="' + qid + '"]');
      grp.querySelectorAll(".chip").forEach(function (c) { c.remove(); });
      var opts = Q[qid].options.slice(); if (Q[qid].other) opts.push(OTHER);
      opts.forEach(function (o) {
        var b = document.createElement("button"); b.className = "chip" + (filters[qid].indexOf(o) >= 0 ? " is-on" : ""); b.textContent = shortLabel(o); b.title = o;
        b.addEventListener("click", function () { var i = filters[qid].indexOf(o); if (i >= 0) filters[qid].splice(i, 1); else filters[qid].push(o); b.classList.toggle("is-on"); applyFilters(); });
        grp.appendChild(b);
      });
    });
  }
  function shortLabel(o) { return o.replace(/（.*?）/g, "").replace(/\(.*?\)/g, ""); }
  function applyFilters() {
    shown = all.filter(function (r) { return Object.keys(filters).every(function (qid) { return !filters[qid].length || filters[qid].indexOf(r.answers[qid]) >= 0; }); });
    $("nShown").textContent = shown.length; $("nAll").textContent = all.length;
    $("filters").hidden = !all.length; $("empty").hidden = !!all.length; $("content").hidden = !all.length;
    if (all.length) renderAll();
  }
  $("clearFilters").addEventListener("click", function () { Object.keys(filters).forEach(function (k) { filters[k] = []; }); buildFilterChips(); applyFilters(); });

  // ---------- aggregation helpers ----------
  function countSingle(qid) {
    var q = Q[qid], opts = (q.options || []).slice(); if (q.other) opts.push(OTHER);
    var m = {}; opts.forEach(function (o) { m[o] = 0; }); var n = 0;
    shown.forEach(function (r) { var v = r.answers[qid]; if (v === undefined || v === null || v === "") return; n++; if (!(v in m)) m[v] = 0; m[v]++; });
    return { labels: Object.keys(m), values: Object.keys(m).map(function (k) { return m[k]; }), n: n };
  }
  function countMulti(qid, opts) {
    var q = Q[qid]; opts = opts || (q.options || []).slice(); if (!opts.length || (q.other && opts.indexOf(OTHER) < 0)) opts = opts.concat(q.other ? [OTHER] : []);
    var m = {}; opts.forEach(function (o) { m[o] = 0; }); var n = 0;
    shown.forEach(function (r) { var v = r.answers[qid]; if (!Array.isArray(v) || !v.length) return; n++; v.forEach(function (x) { if (!(x in m)) m[x] = 0; m[x]++; }); });
    var keys = Object.keys(m).sort(function (a, b) { return m[b] - m[a]; });
    return { labels: keys, values: keys.map(function (k) { return m[k]; }), n: n };
  }
  function countQ6() {
    // Q6 は Q5 の選択肢のどれか（その他は「その他：xxx」の形）
    var m = {}, n = 0;
    shown.forEach(function (r) { var v = r.answers.q6; if (!v) return; n++; var k = v.indexOf(OTHER) === 0 ? OTHER : v; m[k] = (m[k] || 0) + 1; });
    var keys = Object.keys(m).sort(function (a, b) { return m[b] - m[a]; });
    return { labels: keys, values: keys.map(function (k) { return m[k]; }), n: n };
  }
  function texts(qid, withMeta) {
    var out = [];
    shown.forEach(function (r) { var v = r.answers[qid]; if (v && String(v).trim()) out.push({ t: String(v).trim(), meta: [r.answers.q0, r.answers.q1, r.answers.q3].filter(Boolean).map(shortLabel).join(" / ") }); });
    return out;
  }
  function otherTexts(qid) {
    var out = [];
    shown.forEach(function (r) { var v = r.answers[qid + "_other"]; if (v && String(v).trim()) out.push({ t: String(v).trim(), meta: [r.answers.q0, r.answers.q1].filter(Boolean).map(shortLabel).join(" / ") }); });
    return out;
  }

  // ---------- rendering ----------
  function destroyCharts() { charts.forEach(function (c) { c.destroy(); }); charts = []; }
  function card(opts) {
    return '<div class="card' + (opts.wide ? " wide" : "") + '"><h3><span class="qn">' + esc(opts.qn || "") + '</span><span>' + esc(opts.title) + '</span><span class="n">n=' + opts.n + '</span></h3>' + (opts.sub ? '<div class="sub">' + esc(opts.sub) + '</div>' : "") + opts.body + '</div>';
  }
  function chartBox(id, h) { return '<div class="chart" style="height:' + h + 'px"><canvas id="' + id + '"></canvas></div>'; }
  function hbar(id, data, color, isMulti) {
    var n = data.n || 1;
    var c = new Chart($(id), {
      type: "bar",
      data: { labels: data.labels, datasets: [{ data: data.values, backgroundColor: color || C.teal, borderRadius: 5, barThickness: 16, maxBarThickness: 18 }] },
      options: {
        indexAxis: "y", responsive: true, maintainAspectRatio: false, animation: { duration: 350 },
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: function (ctx) { return ctx.parsed.x + "件（" + pct(ctx.parsed.x, n) + "%" + (isMulti ? "の人が選択" : "") + "）"; } } } },
        scales: { x: { beginAtZero: true, ticks: { precision: 0 }, grid: { color: "#EEF0F7" } }, y: { grid: { display: false }, ticks: { color: C.ink, autoSkip: false, font: { size: 11.5 }, callback: function (v) { var l = this.getLabelForValue(v); return l.length > 26 ? l.slice(0, 25) + "…" : l; } } } },
        layout: { padding: { right: 36 } }
      },
      plugins: [{ id: "valueLabels", afterDatasetsDraw: function (chart) { var ctx = chart.ctx; ctx.save(); ctx.font = "700 11px 'M PLUS 1p', sans-serif"; ctx.fillStyle = C.soft; ctx.textBaseline = "middle"; chart.getDatasetMeta(0).data.forEach(function (bar, i) { var v = chart.data.datasets[0].data[i]; ctx.fillText(v + " (" + pct(v, n) + "%)", bar.x + 6, bar.y); }); ctx.restore(); } }]
    });
    charts.push(c);
  }
  function doughnut(id, data) {
    var c = new Chart($(id), {
      type: "doughnut",
      data: { labels: data.labels, datasets: [{ data: data.values, backgroundColor: CAT, borderWidth: 2, borderColor: "#fff" }] },
      options: { responsive: true, maintainAspectRatio: false, cutout: "62%", animation: { duration: 350 }, plugins: { legend: { position: "right", labels: { boxWidth: 10, boxHeight: 10, font: { size: 11.5 }, generateLabels: function (chart) { return chart.data.labels.map(function (l, i) { var v = chart.data.datasets[0].data[i]; return { text: shortLabel(l) + "　" + v + "件 (" + pct(v, data.n) + "%)", fillStyle: CAT[i % CAT.length], strokeStyle: "#fff", index: i, hidden: false }; }); } } }, tooltip: { callbacks: { label: function (ctx) { return ctx.label + ": " + ctx.parsed + "件（" + pct(ctx.parsed, data.n) + "%）"; } } } } }
    });
    charts.push(c);
  }
  function stacked(id, labels, series, colors, total) {
    var c = new Chart($(id), {
      type: "bar",
      data: { labels: labels, datasets: series.map(function (s, i) { return { label: s.label, data: s.data, backgroundColor: colors[i % colors.length], borderRadius: 3, barThickness: 18 }; }) },
      options: { indexAxis: "y", responsive: true, maintainAspectRatio: false, animation: { duration: 350 },
        plugins: { legend: { position: "bottom", labels: { boxWidth: 10, boxHeight: 10, font: { size: 11 } } }, tooltip: { callbacks: { label: function (ctx) { var t = total ? total[ctx.dataIndex] : null; return ctx.dataset.label + ": " + ctx.parsed.x + "件" + (t ? "（" + pct(ctx.parsed.x, t) + "%）" : ""); } } } },
        scales: { x: { stacked: true, beginAtZero: true, ticks: { precision: 0 }, grid: { color: "#EEF0F7" } }, y: { stacked: true, grid: { display: false }, ticks: { color: C.ink, autoSkip: false, font: { size: 11.5 } } } } }
    });
    charts.push(c);
  }

  function renderAll() {
    destroyCharts();
    renderKpis();
    var h = "";
    // ---- 基本属性

      if (rnd() < 0.25) a.q13n = pick(["締切を勝手に管理してほしい", "同じ学部の先輩の体験談が見たい", "とにかく短時間でできるもの", "LINEで完結してほしい"]);
      var d = new Date(Date.now() - Math.floor(rnd() * 20) * 86400000 - Math.floor(rnd() * 86400000));
      out.push({ id: "sample_" + i, submittedAt: d.toISOString(), answers: a, meta: {} });
    }
    return out;
  }

  // ---------- boot ----------
  if (endpoint() && get(LS.key)) load().then(function (ok) { if (!ok) $("settings").hidden = false; });
  else $("settings").hidden = false;
})();
</script>
